name: GetEgged
version: '0.9.1'
main: io.jimbonesjim.getEgged.GetEgged
api-version: '1.21'
authors: [ PopTart_Flavored ]
description: Egg mobs into spawn eggs while preserving mob data.
softdepend: [Vault]

commands:
  getegged:
    description: Gives you egging tool.
    aliases: [ge]
    default: op
    usage: /<command> <get/reload/give>

permissions:
  getegged.get:
    default: true
  getegged.give:
    default: op
  getegged.reload:
    default: op
  getegged.tamed:
    default: op
  getegged.usagebypass:
    default: op
  getegged.animal.*:
    default: op
  getegged.monster.*:
    default: op
  getegged.golem.*:
    default: op